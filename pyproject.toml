[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiofm"
version = "1.0.0"
description = "A vision-language foundation model for coronary artery disease from cardiac CT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "monai>=1.3",
    "transformers>=4.35",
    "sentencepiece",
    "nibabel",
    "scipy",
    "numpy",
    "TotalSegmentator",
]

[project.optional-dependencies]
# Report generation only. The decoder is Llama 2 licensed, not Apache-2.0 --
# see MODEL_LICENSE.md.
reportgen = ["peft>=0.7", "accelerate"]


[project.urls]
Repository = "https://github.com/JinkuiH/CardioFM"

[tool.setuptools.packages.find]
include = ["cardiofm*"]
